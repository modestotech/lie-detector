<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{box-sizing:border-box;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Veritas VX-9 Polygraph</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen instrument panel — status strip, big voice trace, readout row; verdict floods the screen */
:root{
  --bg:#0d1417; --panel:#121c20; --line:#24343a; --fg:#d9e4e2; --muted:#7f9894;
  --trace:#f2b13a; --trace-dim:rgba(242,177,58,.18);
  --lie:#d6262b; --truth:#1f9e55;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--mono);overflow:hidden;overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.app{height:100%;display:flex;flex-direction:column;gap:14px;padding-block:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:900;font-size:clamp(24px,4vw,34px);letter-spacing:.06em;text-transform:uppercase;line-height:1;white-space:nowrap}
.brand small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.12em;margin-left:10px;white-space:nowrap}
.status{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--lie);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.scope{flex:1;min-height:180px;position:relative;background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden}
canvas{display:block;position:absolute;inset:0;width:100%;height:100%}
.scope-label{position:absolute;top:10px;left:12px;font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;z-index:1}
.scope-db{position:absolute;top:10px;right:12px;font-size:11px;color:var(--trace);font-variant-numeric:tabular-nums;z-index:1}
.readouts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ro{border-top:1px solid var(--line);padding-top:8px;min-width:0}
.ro span{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ro b{display:block;font-weight:500;font-size:clamp(18px,2.6vw,24px);font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ro b em{font-style:normal;font-size:.55em;color:var(--muted);margin-left:4px}
.go{align-self:center;width:100%;max-width:420px;min-height:64px;display:flex;align-items:center;justify-content:center;gap:12px;
  font-family:var(--display);font-weight:900;font-size:clamp(24px,4vw,32px);letter-spacing:.12em;text-transform:uppercase;
  color:var(--trace);background:var(--panel);border:2px solid var(--trace);border-radius:6px;cursor:pointer;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:transform .08s,background .08s}
.go:active,.go.pressed{transform:scale(.97);background:var(--trace-dim)}
.go:focus{outline:none}.go:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.go-dot{width:12px;height:12px;border-radius:50%;background:var(--trace);box-shadow:0 0 10px var(--trace)}
@media (max-width:560px){
  .readouts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
  .scope-label{right:90px}
}
@media (max-height:460px){ /* phone held sideways */
  .app{gap:8px;padding-block:8px}
  .brand small{display:none}
  .scope{min-height:120px}
  .ro{padding-top:4px}.ro b{font-size:16px;margin-top:2px}
  .go{min-height:44px;font-size:22px}
}

.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.overlay.analyzing{background:rgba(13,20,23,.9)}
.overlay.lie{background:var(--lie);color:#fff}
.overlay.truth{background:var(--truth);color:#fff}
.verdict{font-family:var(--display);font-weight:900;font-size:clamp(64px,19vw,220px);line-height:.9;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;margin:0}
@media (max-width:560px){.overlay.lie .verdict,.overlay.truth .verdict{font-size:min(30vw,40vh)}}
.sub{font-size:clamp(11px,1.8vw,16px);letter-spacing:.2em;text-transform:uppercase;opacity:.85;max-width:30ch}
.overlay.lie .verdict,.overlay.truth .verdict{animation:slam .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{from{transform:scale(1.35);opacity:0}to{transform:none;opacity:1}}
.analyzing .verdict{font-size:clamp(40px,11vw,90px);color:var(--trace)}
.bar{width:min(420px,80vw);height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--trace)}
.analyzing .bar i{animation:fill 1.6s linear forwards}
@keyframes fill{to{width:100%}}

.hint{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:6;
  background:var(--panel);border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:10px 14px;
  font-size:12px;line-height:1.5;width:max-content;max-width:calc(100vw - 32px);text-align:center;transition:opacity .6s}
.hint.gone{opacity:0;pointer-events:none}
.hint b{color:var(--trace);font-weight:500}
@media (prefers-reduced-motion:reduce){.dot,.overlay .verdict{animation:none}}
</style>
</head><body>

<div class="app" id="app">
  <header>
    <div class="brand">Veritas VX-9<small>Voice stress analyzer</small></div>
    <div class="status"><span class="dot"></span><span>Recording · subject audio</span></div>
  </header>
  <div class="scope">
    <div class="scope-label">Vocal microtremor · 8–14 Hz</div>
    <div class="scope-db" id="db">-32.0 dB</div>
    <canvas id="c"></canvas>
  </div>
  <div class="readouts">
    <div class="ro"><span>Pulse</span><b id="pulse">74<em>bpm</em></b></div>
    <div class="ro"><span>Pitch</span><b id="pitch">182<em>Hz</em></b></div>
    <div class="ro"><span>Skin cond.</span><b id="gsr">4.2<em>µS</em></b></div>
    <div class="ro"><span>Stress index</span><b id="stress">0.31</b></div>
  </div>
  <button id="go" class="go" type="button">Analyze <span class="go-dot"></span></button>
</div>

<div class="overlay" id="ov" hidden>
  <p class="verdict" id="vText"></p>
  <div class="sub" id="vSub"></div>
  <div class="bar"><i></i></div>
</div>

<div class="hint" id="hint">
  Press <b>Analyze</b> to scan · tap to reset<br>
  Keys: <b>Space</b> = not true · <b>Enter</b> = true
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const ov=document.getElementById('ov'),vText=document.getElementById('vText'),vSub=document.getElementById('vSub'),bar=ov.querySelector('.bar');
const hint=document.getElementById('hint');
const rootStyle=getComputedStyle(document.documentElement);
const C={line:rootStyle.getPropertyValue('--line').trim()||'#24343a',trace:rootStyle.getPropertyValue('--trace').trim()||'#f2b13a',dim:rootStyle.getPropertyValue('--trace-dim').trim()||'rgba(242,177,58,.18)'};
let W=0,H=0;
function size(){const dpr=Math.min(window.devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=Math.max(1,W*dpr);cv.height=Math.max(1,H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',size);addEventListener('orientationchange',()=>setTimeout(size,200));size();
if(window.ResizeObserver)new ResizeObserver(size).observe(cv.parentElement);

// Fake "speech": amplitude envelope with syllable bursts and pauses
let t=0,env=0,target=0,nextChange=0;const history=[];
function speech(){
  if(t>nextChange){
    const talking=Math.random()<.72;
    target=talking?.35+Math.random()*.65:Math.random()*.06;
    nextChange=t+(talking?6+Math.random()*16:10+Math.random()*30);
  }
  env+=(target-env)*.18;return env;
}
const $=id=>document.getElementById(id);
function draw(){
  t++;const a=speech();
  history.push(a);if(history.length>300)history.shift();
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle=C.line;ctx.lineWidth=1;ctx.beginPath();
  for(let x=0;x<W;x+=40){ctx.moveTo(x+.5,0);ctx.lineTo(x+.5,H)}
  for(let y=0;y<H;y+=40){ctx.moveTo(0,y+.5);ctx.lineTo(W,y+.5)}
  ctx.stroke();
  const mid=H/2,bw=W/300;
  ctx.fillStyle=C.dim;
  for(let i=0;i<history.length;i++){const h=history[i]*H*.42;ctx.fillRect(i*bw,mid-h,Math.max(bw-.5,1),h*2)}
  ctx.strokeStyle=C.trace;ctx.lineWidth=2;ctx.beginPath();
  const step=W<500?3:2;
  for(let x=0;x<=W;x+=step){
    const p=x/W*Math.PI*2;
    const y=mid+a*H*.36*(Math.sin(p*6+t*.31)*.55+Math.sin(p*17-t*.73)*.3+Math.sin(p*41+t*1.7)*.15)*(.75+Math.random()*.25)+(Math.random()-.5)*3;
    x?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  ctx.stroke();
  if(t%6===0){
    $('db').textContent=(-48+a*44+Math.random()*2).toFixed(1)+' dB';
    $('pitch').firstChild.nodeValue=Math.round(150+a*90+Math.random()*12);
    $('stress').textContent=(.2+a*.5+Math.random()*.08).toFixed(2);
  }
  if(t%40===0){
    $('pulse').firstChild.nodeValue=Math.round(70+Math.random()*14);
    $('gsr').firstChild.nodeValue=(3.8+Math.random()*1.4).toFixed(1);
  }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// Keep the phone screen awake while in use
let lock=null;
async function wake(){try{if(!lock&&navigator.wakeLock){lock=await navigator.wakeLock.request('screen');lock.addEventListener('release',()=>{lock=null})}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wake()});

// Hint: shown on load, fades after 6 s or at first input
let hintTimer=setTimeout(()=>hint.classList.add('gone'),6000);
function hideHint(){clearTimeout(hintTimer);hint.classList.add('gone')}

let busy=false,timer;
function verdict(isTrue){
  if(busy)return;busy=true;hideHint();
  ov.className='overlay analyzing';ov.hidden=false;bar.hidden=false;
  vText.textContent='Analyzing…';vSub.textContent='Cross-referencing vocal stress markers';
  const fill=bar.firstElementChild;fill.style.animation='none';void fill.offsetWidth;fill.style.animation='';
  timer=setTimeout(()=>{
    bar.hidden=true;
    ov.className='overlay '+(isTrue?'truth':'lie');
    vText.textContent=isTrue?'True':'Not true';
    vSub.textContent=isTrue?'Statement verified · confidence 97.4%':'Deception detected · confidence 98.1%';
    if(navigator.vibrate)try{navigator.vibrate(isTrue?60:[120,60,120])}catch(e){}
  },1600);
}
function reset(){clearTimeout(timer);ov.hidden=true;busy=false}

addEventListener('keydown',e=>{
  if(e.code==='Space'||e.key===' '){e.preventDefault();ov.hidden?verdict(false):reset()}
  else if(e.key==='Enter'){e.preventDefault();ov.hidden?verdict(true):reset()}
  else if(e.key==='Escape')reset();
});

// Analyze button: left half = not true, right half = true (nothing on screen shows the split).
// While a verdict is showing, a tap anywhere resets. Works for touch, pen and mouse.
const btn=$('go');
let lastTap=0;
function onTap(x,target){
  const now=Date.now();if(now-lastTap<350)return;lastTap=now; // ignore the duplicate touch+pointer event
  wake();
  if(!ov.hidden){reset();return}
  if(!btn.contains(target))return;
  const r=btn.getBoundingClientRect();
  btn.classList.add('pressed');setTimeout(()=>btn.classList.remove('pressed'),120);
  verdict(x>r.left+r.width/2);
}
if(window.PointerEvent){
  addEventListener('pointerdown',e=>{if(e.isPrimary!==false){if(btn.contains(e.target))e.preventDefault();onTap(e.clientX,e.target)}});
}else{
  addEventListener('touchstart',e=>{const p=e.changedTouches[0];if(p)onTap(p.clientX,e.target)},{passive:true});
  addEventListener('mousedown',e=>{if(btn.contains(e.target))e.preventDefault();onTap(e.clientX,e.target)});
}
// All activation goes through pointer/key handlers; swallow the native click so Enter/Space on a focused button can't double-fire
btn.addEventListener('click',e=>e.preventDefault());
addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body></html>
